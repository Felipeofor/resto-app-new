<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7a1a0a"/>
      <stop offset="100%" stop-color="#3d0d05"/>
    </radialGradient>
    <radialGradient id="plateGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#d4c4aa"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000055"/>
    </filter>
  </defs>

  <!-- Outer shield/crest shape -->
  <path d="M100 8 L178 38 L178 110 Q178 160 100 192 Q22 160 22 110 L22 38 Z"
    fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Inner border -->
  <path d="M100 18 L168 44 L168 110 Q168 154 100 183 Q32 154 32 110 L32 44 Z"
    fill="none" stroke="#c0392b" stroke-width="2.5" opacity="0.8"/>

  <!-- Decorative top banner -->
  <path d="M54 62 Q100 55 146 62 L146 78 Q100 71 54 78 Z"
    fill="#c0392b"/>
  <text x="100" y="73.5" text-anchor="middle" font-family="Georgia, serif"
    font-size="11" font-weight="bold" fill="#f5ede0" letter-spacing="2">DON CARLOS</text>

  <!-- Plate / circle -->
  <circle cx="100" cy="118" r="40" fill="url(#plateGrad)" opacity="0.95"/>
  <circle cx="100" cy="118" r="36" fill="none" stroke="#b8985a" stroke-width="1.5"/>

  <!-- Grill fork & knife icon -->
  <!-- Fork (left) -->
  <g transform="translate(83, 100)" fill="#5a3010">
    <rect x="3.5" y="0" width="1.5" height="14" rx="0.75"/>
    <rect x="1" y="0" width="1.5" height="8" rx="0.75"/>
    <rect x="6" y="0" width="1.5" height="8" rx="0.75"/>
    <path d="M1 8 Q3.25 12 5.5 8" fill="none" stroke="#5a3010" stroke-width="1.2"/>
  </g>
  <!-- Knife (right) -->
  <g transform="translate(111, 100)" fill="#5a3010">
    <rect x="3" y="0" width="1.8" height="14" rx="0.9"/>
    <path d="M4.9 0 Q9 5 4.9 10" fill="#5a3010"/>
  </g>
  <!-- Steak on plate -->
  <ellipse cx="100" cy="121" rx="13" ry="8" fill="#8B3A0F" opacity="0.9"/>
  <ellipse cx="100" cy="120" rx="11" ry="6" fill="#A0440F" opacity="0.9"/>
  <!-- Grill marks -->
  <line x1="93" y1="117" x2="96" y2="124" stroke="#5a1a05" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="116" x2="101" y2="123" stroke="#5a1a05" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="103" y1="116" x2="106" y2="123" stroke="#5a1a05" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Flames above plate -->
  <g opacity="0.9">
    <path d="M88 98 Q86 92 90 89 Q88 95 93 93 Q90 87 94 84 Q93 91 98 90 Q95 84 100 80 Q105 84 102 90 Q106 91 103 84 Q107 87 106 93 Q111 95 109 89 Q113 92 111 98"
      fill="#e74c3c" stroke="none"/>
    <path d="M91 98 Q89 93 92 91 Q90 96 95 94 Q93 89 96 87 Q95 93 100 91 Q105 93 104 87 Q107 89 105 94 Q110 96 108 91 Q111 93 109 98"
      fill="#e67e22" stroke="none" opacity="0.7"/>
    <path d="M94 98 Q93 94 96 92 Q95 96 99 95 Q97 91 100 89 Q103 91 101 95 Q104 96 103 92 Q106 94 105 98"
      fill="#f39c12" stroke="none" opacity="0.6"/>
  </g>

  <!-- Bottom text area -->
  <path d="M54 148 Q100 141 146 148 L146 163 Q100 156 54 163 Z"
    fill="#c0392b"/>
  <text x="100" y="159" text-anchor="middle" font-family="Georgia, serif"
    font-size="9.5" font-weight="bold" fill="#f5ede0" letter-spacing="1.5">LA PARRILLA</text>

  <!-- Stars -->
  <text x="62" y="137" text-anchor="middle" font-size="10" fill="#b8985a">★</text>
  <text x="138" y="137" text-anchor="middle" font-size="10" fill="#b8985a">★</text>

  <!-- Bottom tagline -->
  <text x="100" y="186" text-anchor="middle" font-family="Georgia, serif"
    font-size="7" fill="#b8985a" letter-spacing="1" opacity="0.9">DESDE 1985</text>
</svg>
